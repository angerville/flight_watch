name: 대련 출발 · 인천 도착 오픈조 항공권 가격 트래커

# 이 저장소는 flight_watch 전용이라 working-directory 지정이 필요 없다
# (2026-08-28, 공모전 자동화 저장소에서 분리).
#
# GitHub 호스팅 러너(ubuntu-latest)를 쓴다 — PC를 계속 켜두지 않아도 돌아가야
# 하기 때문이다. Google Flights는 이 IP대를 차단하지 않는 걸 확인했지만,
# 클라우드 IP라 간헐적으로 결과가 비거나 실패할 수 있다 — track_prices.py는
# 그런 실패를 건너뛰고 다음 실행에서 재시도하도록 설계됨.
on:
  schedule:
    # 12시간마다(00/12시 UTC = 한국 9시/21시) 13분에. 정각(0분)은 전 세계 cron이 몰려
    # 대기열 지연이 크므로 피함.
    #
    # 원래 매시간이었는데 실제로는 하루 2~3번밖에 안 돌았다. 이 저장소가
    # 비공개라 Actions 사용량이 무료 할당량(월 2,000분)에서 차감되는데,
    # 1회 실행이 약 15분이라 매시간이면 월 10,000분이 넘어 한도를 7배
    # 초과했기 때문. 분리 전 저장소에서 부담이 적은 주 1회 워크플로는 몇
    # 주째 한 번도 안 빠지고 정확히 돌고 있어, 빈도가 원인임이 확인됐다.
    #
    # 평소 매시간 조회는 PC의 작업 스케줄러가 담당하고, 이 워크플로는 PC가
    # 꺼져 있는 동안을 메우는 용도다 — 그래서 할당량에 확실히 들어오는
    # 간격으로 낮췄다.
    #
    # 2026-10: 대련→(지역)→인천 오픈조 추적으로 바꾸면서 1회 조회가 늘었다
    # (지역 5곳 x 공항 조합 x 날짜 2개 = 약 72회, 20분 남짓). 6시간 간격이면
    # 월 약 2,400분이라 무료 할당량(2,000분)을 넘기 때문에 12시간 간격(월 약
    # 1,200분)으로 늦췄다. 조회 수를 늘리거나 지역을 더 켜면 다시 계산할 것.
    - cron: "13 0,12 * * *"
  workflow_dispatch: {}

# 상태 DB를 더 이상 커밋하지 않으므로 읽기 권한이면 충분하다.
permissions:
  contents: read

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 가격 조회 실행
        env:
          FLIGHT_TELEGRAM_BOT_TOKEN: ${{ secrets.FLIGHT_TELEGRAM_BOT_TOKEN }}
          FLIGHT_TELEGRAM_CHAT_ID: ${{ secrets.FLIGHT_TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python track_prices.py

      # 상태 DB(state/flight_prices.sqlite)는 일부러 커밋하지 않는다.
      #
      # 예전에는 여기서 커밋·푸시했는데, 같은 sqlite를 이 워크플로와 PC의 작업
      # 스케줄러가 각자 갱신하다 보니 내용이 갈라졌다. sqlite는 바이너리라
      # 자동 병합이 안 돼서 매번 충돌했고, 실제로 한 번은 충돌을 한쪽으로
      # 밀어버리면서 PC가 기록한 조회 이력 108건이 통째로 날아갔다.
      #
      # 그래서 가격 이력은 PC 쪽만 소유하도록 정리했다. 이 워크플로는 PC가
      # 꺼져 있는 동안 조회해서 알림을 보내는 역할만 하고, 결과는 남기지
      # 않는다 (커밋된 DB를 기준으로 비교만 한다).
      #
      # 부작용: PC가 오래 꺼져 있으면 기준 DB가 갱신되지 않아, 같은 가격
      # 하락 알림이 실행 때마다 다시 갈 수 있다. 알림을 놓치는 것보다는
      # 낫다고 보고 감수한다.
