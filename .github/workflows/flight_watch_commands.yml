name: 항공권 트래커 설정 봇 명령어 처리

# flight_watch.yml(시간당 1회, Playwright 필요, 느림)과 분리된 가벼운 폴러.
# 브라우저를 안 띄우니 훨씬 자주 돌려도 부담이 적고, 텔레그램으로 보낸
# /budget, /dates, /destinations 같은 명령어에 거의 실시간으로 반응한다.
#
# config.yaml(사람이 손으로 편집)은 절대 건드리지 않고 state/overrides.json만
# 갱신한다 — flight_watch.yml의 상태 DB 커밋과 건드리는 파일이 겹치지 않아
# 두 워크플로가 동시에 돌아도 git push 충돌이 안 난다.
#
# 이 저장소는 flight_watch 전용이라 working-directory 지정이 필요 없다
# (2026-08-28, 공모전 자동화 저장소에서 분리).
# 예약 실행은 껐다 (필요하면 workflow_dispatch로 수동 실행).
#
# 두 가지 이유다.
#
# 1) 로컬 봇과 텔레그램 메시지를 서로 뺏어간다. getUpdates는 offset을 넘기면
#    그 앞의 메시지를 큐에서 지워버리는데, PC의 작업 스케줄러와 이 워크플로가
#    같은 봇 토큰으로 동시에 폴링하면 한쪽이 가져간 명령어를 다른 쪽은 영영
#    못 본다. 지금은 PC 쪽 bot_commands.py가 롱폴링으로 상주하며 즉시
#    응답하므로 이쪽은 필요 없다.
#
# 2) 무료 할당량을 혼자 다 먹는다. 10분마다면 하루 144회인데 Actions는 1회당
#    최소 1분으로 과금돼 월 4,000분이 넘는다 — 비공개 저장소 무료 한도(월
#    2,000분)의 두 배다. 항공권 조회(flight_watch.yml)가 밀려서 하루 2~3번밖에
#    안 돌던 원인이기도 하다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-watch-commands
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install --quiet PyYAML requests

      - name: 명령어 확인 및 처리
        env:
          FLIGHT_TELEGRAM_BOT_TOKEN: ${{ secrets.FLIGHT_TELEGRAM_BOT_TOKEN }}
          FLIGHT_TELEGRAM_CHAT_ID: ${{ secrets.FLIGHT_TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python bot_commands.py

      - name: 설정 변경분 커밋
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/overrides.json state/telegram_offset.txt
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore(flight-watch): 설정 명령어 반영 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "푸시 재시도 $i..."
            sleep 5
          done
          echo "::error::설정 커밋 푸시에 실패했습니다"
          exit 1
