# =============================================================================
# 대련(DLC) 출발 국경절 항공권 가격 트래커 설정
# =============================================================================
# Ctrip/Trip.com은 자동화 접근을 자체 WAF("whaleguard")로 즉시 차단하므로
# (요청 시점에 상태코드 432 확인) 데이터 소스는 Google Flights만 쓴다.
# Google Flights는 봇 차단 없이 정상 응답하며, 통화를 KRW로 고정해 예산과
# 바로 비교할 수 있다.

origin: "Dalian"       # Google Flights 검색어에 들어가는 출발지 표기

# 왕복 후보 날짜: 출발일 각각에 대해 귀국일 고정으로 검사한다.
# min_departure_hour: 이 시각(24시간제, 이상) 이후 출발편만 인정. 제약 없으면 null.
#   9/30은 그날 일정상 17시 이후 출발편만 탈 수 있어서 그 전 시간대 항공편은
#   가격이 아무리 싸도 후보에서 제외한다.
depart_dates:
  - date: "2026-09-30"
    min_departure_hour: 17
  - date: "2026-10-01"
    min_departure_hour: null
return_date: "2026-10-07"

# 예산(원). 이 가격 이하로 떨어지면 알림.
budget_krw: 500000

# 관심 상한가(원). 이 값을 넘는 목적지는 현황 요약과 "최저가 갱신" 알림에서
# 뺀다 — 리장·싼야·청두처럼 늘 100만원대라 목록만 채우고 실제로 안 가는 곳들을
# 걸러내려는 것. 단, 상한가 위여도 직전 최저가 대비 25%(SPECIAL_DEAL_DROP_PCT)
# 이상 급락하면 "진짜 특가"로 보고 그때는 알린다. 상한 없이 전부 보려면 null.
max_price_krw: 800000

# 매 실행마다(=시간당 1회) 가격 변동이 없어도 현황 요약을 텔레그램으로 보낼지.
# false로 두면 예산 진입/최저가 갱신 같은 "사건"이 있을 때만 알림이 온다.
hourly_digest: true
# 현황 요약에 표시할 항공권 개수 (싼 순서로 이만큼만).
digest_top_n: 10

# 검색 대상 도시. Google Flights 검색어에 그대로 들어가므로 영문 도시명을
# 쓴다. display는 텔레그램 메시지용 한글 표기.
# 원래는 중국 국내로만 한정했다가, 예산만 맞으면 어디든 상관없다는 원래
# 취지에 맞춰 일본·대만·홍콩·마카오·동남아까지 넓혔다 (한국은 출발지 기준
# 여행지로서 의미가 없어 제외). Google Flights는 "어디든" 같은 자연어나
# /travel/flights/explore 지도 검색은 날짜를 무시해버려 자동화가 안 되므로,
# 후보 도시를 정해두고 하나씩 정확한 날짜로 조회하는 지금 방식을 유지한다.
destinations:
  # 중국 국내
  - {query: "Sanya",        display: "싼야(하이난)"}
  - {query: "Kunming",      display: "쿤밍"}
  - {query: "Lijiang",      display: "리장"}
  - {query: "Xiamen",       display: "샤먼"}
  - {query: "Guilin",       display: "구이린"}
  - {query: "Zhangjiajie",  display: "장자제"}
  - {query: "Chengdu",      display: "청두"}
  - {query: "Chongqing",    display: "충칭"}
  - {query: "Xian",         display: "시안"}
  - {query: "Qingdao",      display: "칭다오"}
  - {query: "Shanghai",     display: "상하이"}
  - {query: "Guangzhou",    display: "광저우"}
  - {query: "Shenzhen",     display: "선전"}
  - {query: "Changsha",     display: "창사"}
  - {query: "Guiyang",      display: "구이양"}
  # 일본
  - {query: "Tokyo",        display: "도쿄"}
  - {query: "Osaka",        display: "오사카"}
  - {query: "Fukuoka",      display: "후쿠오카"}
  - {query: "Sapporo",      display: "삿포로"}
  # 대만 · 홍콩 · 마카오
  - {query: "Taipei",       display: "타이베이"}
  - {query: "Hong Kong",    display: "홍콩"}
  - {query: "Macau",        display: "마카오"}
  # 동남아
  - {query: "Bangkok",         display: "방콕"}
  - {query: "Ho Chi Minh City", display: "호치민"}
  - {query: "Hanoi",           display: "하노이"}
  - {query: "Da Nang",         display: "다낭"}
  - {query: "Manila",          display: "마닐라"}
  - {query: "Cebu",            display: "세부"}
  - {query: "Singapore",       display: "싱가포르"}
  - {query: "Kuala Lumpur",    display: "쿠알라룸푸르"}
  - {query: "Phnom Penh",      display: "프놈펜"}
  - {query: "Bali",            display: "발리"}

# 목적지 사이 요청 간 딜레이(초). 너무 빠르게 연달아 조회하지 않도록 배려.
request_delay_seconds: 4

# 페이지 로드 후 결과 렌더링을 기다리는 시간(ms)
render_wait_ms: 9000

state_db: "state/flight_prices.sqlite"
