# =============================================================================
# 대련(DLC) 출발 · 인천(ICN) 도착 오픈조 항공권 트래커
# =============================================================================
# Ctrip/Trip.com은 자동화 접근을 자체 WAF("whaleguard")로 즉시 차단하므로
# (요청 시점에 상태코드 432 확인) 데이터 소스는 Google Flights만 쓴다.
# Google Flights는 봇 차단 없이 정상 응답하며, 통화를 KRW로 고정해 예산과
# 바로 비교할 수 있다.

# 여행 구상: 1월 초에 대련에서 어느 지역으로 들어가 약 2주 동안 그 지역
# 안에서 이동하며 여행하고, 같은 지역의 (다른) 공항에서 인천으로 나온다.
# 들어가는 공항과 나오는 공항이 달라 자연어 검색("Flights from A to B")으로는
# 안 되고, 구글 항공권 URL의 tfs 파라미터를 직접 만들어 조회한다(다구간/오픈조).
# 코드는 전부 IATA 공항 코드.
origin: "DLC"          # 대련 저우수이쯔
final_dest: "ICN"       # 인천

# 출발일(대련 출발)·도착일(인천 도착) 조합. "1/9~11 사이 출발, 1/22~24 사이
# 도착"을 전부 교차 조합(3x3=9)하면 조회 수가 너무 늘어나므로(실행 시간·
# GitHub Actions 사용량 때문), 양끝 날짜 2개만 남겼다. 13일 여행 기간을
# 유지한 채 시작을 앞/뒤로.
date_options:
  - {depart: "2027-01-09", return: "2027-01-22"}
  - {depart: "2027-01-11", return: "2027-01-24"}

# 예산(원). 이 가격 이하로 떨어지면 알림.
budget_krw: 800000

# 관심 상한가(원). 이 값을 넘는 조합은 현황 요약과 "최저가 갱신" 알림에서
# 뺀다. 단, 상한가 위여도 직전 최저가 대비 25%(SPECIAL_DEAL_DROP_PCT) 이상
# 급락하면 "진짜 특가"로 보고 그때는 알린다. 상한 없이 전부 보려면 null.
max_price_krw: 1500000

# 매 실행마다(=시간당 1회) 가격 변동이 없어도 현황 요약을 텔레그램으로 보낼지.
# false로 두면 예산 진입/최저가 갱신 같은 "사건"이 있을 때만 알림이 온다.
hourly_digest: true
# 현황 요약에 표시할 조합 개수 (싼 순서로 이만큼만). null이면 상한가 이하는 전부 표시.
digest_top_n: null

# ---------------------------------------------------------------------------
# 지정 여정(watch_trips) — 위 오픈조 탐색과 별개로, 정해진 날짜의 특정 편을 그대로
# 추적한다. 왕복 검색에서 가는편 카드를 골라 클릭하고, 오는편 화면에서 편마다
# 왕복 총액을 따로 기록한다(가는편 x 오는편 조합마다 별도 항목).
#   outbound/return.depart : 24시간제 "HH:MM", 그 목록, 또는 all(나온 편 전부)
#   airline                : 생략 가능. 구글 표기 그대로(예: "중국남방항공")
#   after                  : "HH:MM" — 이 시각 이후(포함) 출발편만 (depart: all과 같이)
#   return 생략            : 편도로 조회
#   direct_only            : true면 가는편·오는편 모두 직항만
#   budget_krw             : 이 금액 이하로 떨어지면 💰 알림 (null이면 하락 알림만)
#   max_price_krw          : 생략 가능(없으면 상한 없음)
# 가는편 날짜가 지나면 자동으로 조회를 멈춘다.
# ---------------------------------------------------------------------------
watch_trips:
  # 2026-10-15. 10/30 대련→인천 직항 x 11/2 인천→대련 직항, 왕복 조합 전부.
  # (10/14~15에 따로 두었던 남방항공 19:10+17:30/22:40, 대한항공 14:25 왕복,
  # 11/2 편도 항목을 이걸로 합침.) 가는편마다 결과를 다시 불러와야 해서 1회 1~2분.
  - name: "대련⇄인천 직항"
    outbound: {date: "2026-10-30", from: DLC, to: ICN, depart: all, after: "14:25"}
    return:   {date: "2026-11-02", from: ICN, to: DLC, depart: all}
    direct_only: true
    budget_krw: 280000

# ---------------------------------------------------------------------------
# 지역(regions) — "들어가는 공항 -> 나오는 공항" 조합은 같은 지역 안에서만 만든다.
#
# 지역 하나 = 1월 초에 들어가서 2주 안에 (육로·국내선으로) 다닐 수 있는 범위.
# "우루무치로 들어갔다가 상하이에서 나오는" 식으로 지역을 가로지르는
# 비현실적인 조합은 애초에 만들지 않는다.
#
#   in       : 대련에서 들어가는 공항 후보
#   out      : 인천으로 나오는 공항 후보
#   airports : in/out을 따로 안 적고 이것만 적으면 둘 다 이 목록을 쓴다
#              (같은 공항으로 들고 나는 조합도 포함)
#   enabled  : false면 조회 안 함 (아래 "후보" 지역들은 꺼둔 상태)
#   budget_krw / max_price_krw : 이 지역만의 예산·상한가. 안 적으면 위 전체
#              기본값을 쓴다. 가격대가 지역마다 크게 달라서(중국 남부 60~85만원,
#              중앙아시아 130만원대, 코카서스 200만원~, 스리랑카 390만원) 따로
#              둘 수 있게 했다. 지금 값은 2026-09-30 첫 탐색 때 나온 최저가를
#              보고 잡은 초기값이니 실제로 살 만한 가격대에 맞춰 조정할 것.
#              (텔레그램 /budget, /maxprice는 전체 기본값만 바꾼다 — 지역에
#              값이 따로 적혀 있으면 그 지역엔 적용되지 않는다.)
#
# 조회 수 = 지역별 (in 개수 x out 개수) 합계 x date_options 개수. 조합 하나당
# 15~20초 걸리고, 클라우드(GitHub Actions)는 40분 타임아웃과 월 무료 사용량이
# 있으니 지역을 켤수록 그만큼 오래 걸리고 사용량도 늘어난다는 점에 주의.
# ---------------------------------------------------------------------------
regions:
  # ---- 켜둔 지역 -----------------------------------------------------------
  - name: "광시·구이저우"
    enabled: true
    budget_krw: 650000
    max_price_krw: 900000
    airports:
      - {code: KWL, display: "구이린"}
      - {code: NNG, display: "난닝"}
      - {code: KWE, display: "구이양"}

  - name: "푸젠"
    enabled: true
    budget_krw: 550000
    max_price_krw: 800000
    airports:
      - {code: XMN, display: "샤먼"}
      - {code: FOC, display: "푸저우"}
      - {code: WUS, display: "우이산"}

  # 카스로 들어가서 육로로 중앙아시아를 넘어가는 코스 — 나오는 쪽은 인천
  # 직항/경유편이 그나마 있는 큰 도시 위주. (반대 방향은 카스->인천이 사실상
  # 우루무치 경유라 넣지 않았다.)
  - name: "카스~중앙아시아"
    enabled: true
    budget_krw: 1300000
    max_price_krw: 1900000
    in:
      - {code: KHG, display: "카스"}
      - {code: URC, display: "우루무치"}
    out:
      - {code: TAS, display: "타슈켄트"}
      - {code: SKD, display: "사마르칸트"}
      - {code: FRU, display: "비슈케크"}
      - {code: ALA, display: "알마티"}

  - name: "스리랑카"
    enabled: true
    budget_krw: 3000000
    max_price_krw: 4500000
    airports:
      - {code: CMB, display: "콜롬보"}

  # 조지아·아르메니아에 아제르바이잔(바쿠)까지 묶은 코카서스 3국.
  - name: "코카서스"
    enabled: true
    budget_krw: 2000000
    max_price_krw: 3000000
    airports:
      - {code: TBS, display: "트빌리시"}
      - {code: EVN, display: "예레반"}
      - {code: GYD, display: "바쿠"}

  # ---- 후보 지역(꺼둠) — 켜려면 enabled: true ----------------------------
  - name: "윈난"
    enabled: false
    budget_krw: 800000
    max_price_krw: 1200000
    airports:
      - {code: KMG, display: "쿤밍"}
      - {code: DLU, display: "다리"}
      - {code: LJG, display: "리장"}

  - name: "베트남"
    enabled: false
    budget_krw: 650000
    max_price_krw: 1000000
    airports:
      - {code: HAN, display: "하노이"}
      - {code: DAD, display: "다낭"}
      - {code: SGN, display: "호치민"}

  - name: "태국·라오스"
    enabled: false
    budget_krw: 2000000
    max_price_krw: 3000000
    airports:
      - {code: BKK, display: "방콕"}
      - {code: CNX, display: "치앙마이"}
      - {code: LPQ, display: "루앙프라방"}

  # 이스탄불로 들어가서 서쪽/카파도키아/안탈리아 등으로 빠지는 코스.
  - name: "튀르키예"
    enabled: false
    budget_krw: 1700000
    max_price_krw: 2500000
    in:
      - {code: IST, display: "이스탄불"}
    out:
      - {code: IST, display: "이스탄불"}
      - {code: ADB, display: "이즈미르"}
      - {code: AYT, display: "안탈리아"}
      - {code: NAV, display: "카파도키아"}

# 한 번 실행이 이 시간(분)을 넘기면 거기서 멈추고, 그때까지 모인 결과로 알림/현황을
# 보낸다. GitHub Actions 타임아웃(40분)에 잘려서 아무것도 못 보내는 걸 막으려는
# 것 — 멈춘 날엔 다음 실행이 다른 위치부터 시작해서 뒤쪽 지역이 굶지 않는다.
max_run_minutes: 33

# 클라우드(GitHub Actions)에서 1월 지역 조회를 12시간마다만 할지. 비공개 저장소
# 무료 사용량(월 2,000분) 때문에 켜뒀다가, 2026-10-29 저장소를 공개로 바꿔 사용량
# 제한이 없어져 끔(false = 클라우드 실행마다 지역 조회). PC 실행과는 무관.
cloud_regions_every_12h: false

# 클라우드 실행에서 공항 조합을 몇 묶음으로 나눠 번갈아 조회할지. 3이면 한 번 실행에
# 전체의 1/3만 조회해 사용량이 1/3로 줄고, 12시간마다 다음 묶음으로 넘어간다.
cloud_region_groups: 3

# 조합 사이 요청 간 딜레이(초). 너무 빠르게 연달아 조회하지 않도록 배려.
request_delay_seconds: 4

# 페이지 로드 후 결과가 뜨기를 기다리는 "최대" 시간(ms). 결과가 뜨면 바로 읽으니
# 평소엔 이보다 훨씬 빨리 끝난다. 구글이 처음 계산하는 조합은 첫 카드가 뜨기까지
# 10초 넘게 걸리기도 해서(실측 12초) 넉넉히 잡았다. 그 조합에 판매 중인 운임이
# 없으면("가격을 확인할 수 없습니다") 4초 만에 포기한다.
render_wait_ms: 20000

state_db: "state/flight_prices.sqlite"
